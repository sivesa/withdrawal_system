# ---------------------------------------------------------------------------
# Enviro365 Withdrawal Management System - application configuration
# ---------------------------------------------------------------------------

spring.application.name=enviro365-withdrawal-system
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console - handy for inspecting seeded data during development/marking
# Visit http://localhost:8080/h2-console (JDBC URL above, user sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson - keep dates/decimals readable in JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.enviro.assessment.junior.sive=INFO
